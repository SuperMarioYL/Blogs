{{ define "main" }}
<div class="search-container">
  <h1>{{ .Title }}</h1>
  <input type="text" id="search-input" placeholder="输入关键词搜索..." autofocus>
  <div id="search-results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
<script>
  let fuse;

  // 加载搜索索引
  fetch('/index.json')
    .then(response => response.json())
    .then(data => {
      const options = {
        keys: ['title', 'content', 'tags', 'categories'],
        threshold: 0.3,
        includeMatches: true
      };
      fuse = new Fuse(data, options);
    });

  // 搜索逻辑
  document.getElementById('search-input').addEventListener('input', function(e) {
    const query = e.target.value;
    const results = fuse ? fuse.search(query) : [];
    const container = document.getElementById('search-results');

    if (query.length < 2) {
      container.innerHTML = '';
      return;
    }

    if (results.length === 0) {
      container.innerHTML = '<p class="no-results">没有找到相关文章</p>';
      return;
    }

    container.innerHTML = results.slice(0, 10).map(result => `
      <div class="search-result">
        <a href="${result.item.permalink}">${result.item.title}</a>
        <p>${result.item.summary || ''}</p>
        <span class="search-date">${result.item.date ? new Date(result.item.date).toLocaleDateString('zh-CN') : ''}</span>
      </div>
    `).join('');
  });
</script>

<style>
  .search-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 0;
  }
  #search-input {
    width: 100%;
    padding: 1rem;
    font-size: 1.2rem;
    font-family: inherit;
    background: var(--background);
    color: var(--color);
    border: 2px solid var(--accent);
    margin-bottom: 2rem;
  }
  #search-input:focus {
    outline: none;
    box-shadow: 0 0 10px var(--accent);
  }
  .search-result {
    padding: 1.5rem;
    border-bottom: 1px solid var(--accent);
    transition: background 0.2s;
  }
  .search-result:hover {
    background: rgba(255, 165, 0, 0.1);
  }
  .search-result a {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--accent);
  }
  .search-result p {
    margin: 0.5rem 0;
    color: var(--color);
    opacity: 0.8;
  }
  .search-date {
    font-size: 0.85rem;
    opacity: 0.6;
  }
  .no-results {
    text-align: center;
    padding: 2rem;
    opacity: 0.6;
  }
</style>
{{ end }}
