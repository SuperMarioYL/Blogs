<link rel="stylesheet" href="/css/custom.css">

<!-- 代码块复制按钮样式 -->
<style>
.highlight {
  position: relative;
}
.copy-button {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 4px 8px;
  font-size: 12px;
  background: var(--accent, #e97c00);
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
}
.highlight:hover .copy-button {
  opacity: 1;
}
.copy-button:hover {
  background: color-mix(in srgb, var(--accent, #e97c00) 80%, #000);
}
.copy-button.copied {
  background: #28a745;
}
</style>

<!-- MathJax 数学公式支持 -->
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']],
    processEscapes: true
  },
  svg: {
    fontCache: 'global'
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

<!-- Mermaid 图表支持 -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
    mermaid.initialize({
        startOnLoad: false,
        theme: 'neutral'
    });
    document.addEventListener('DOMContentLoaded', function() {
        // 把 ```mermaid 代码块转换为 mermaid 可识别的格式
        document.querySelectorAll('pre code.language-mermaid').forEach(function(el) {
            var pre = el.parentElement;
            var div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = el.textContent;
            pre.parentElement.replaceChild(div, pre);
        });
        mermaid.run();
    });
</script>

<!-- 代码块复制功能 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.highlight').forEach(function(block) {
    var button = document.createElement('button');
    button.className = 'copy-button';
    button.textContent = 'Copy';
    button.addEventListener('click', function() {
      // 只复制代码内容，不包含行号
      var codeLines = block.querySelectorAll('td:last-child code, .cl');
      var text = '';
      if (codeLines.length > 0) {
        codeLines.forEach(function(line) {
          text += line.textContent + '\n';
        });
        text = text.trimEnd();
      } else {
        var code = block.querySelector('code');
        text = code ? code.textContent : block.textContent;
      }
      navigator.clipboard.writeText(text).then(function() {
        button.textContent = 'Copied!';
        button.classList.add('copied');
        setTimeout(function() {
          button.textContent = 'Copy';
          button.classList.remove('copied');
        }, 2000);
      });
    });
    block.appendChild(button);
  });
});
</script>
