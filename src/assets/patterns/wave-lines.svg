<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 120 60">
  <defs>
    <pattern id="waves" width="120" height="60" patternUnits="userSpaceOnUse">
      <!-- Smooth wave line 1 -->
      <path
        d="M0,30 Q30,10 60,30 T120,30"
        fill="none"
        stroke="rgba(240,147,251,0.1)"
        stroke-width="1.5"
        vector-effect="non-scaling-stroke"
      />
      <!-- Smooth wave line 2 -->
      <path
        d="M0,45 Q30,25 60,45 T120,45"
        fill="none"
        stroke="rgba(245,87,108,0.08)"
        stroke-width="1"
        vector-effect="non-scaling-stroke"
      />
      <!-- Smooth wave line 3 -->
      <path
        d="M0,15 Q30,35 60,15 T120,15"
        fill="none"
        stroke="rgba(102,126,234,0.08)"
        stroke-width="1"
        vector-effect="non-scaling-stroke"
      />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#waves)"/>
</svg>
