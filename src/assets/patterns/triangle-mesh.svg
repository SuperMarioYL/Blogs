<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="triangle" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Triangle grid pattern -->
      <path
        d="M0,40 L40,0 L80,40 L40,80 Z"
        fill="none"
        stroke="rgba(118,75,162,0.12)"
        stroke-width="1"
        vector-effect="non-scaling-stroke"
      />
      <path
        d="M0,40 L40,80"
        stroke="rgba(118,75,162,0.08)"
        stroke-width="0.5"
        vector-effect="non-scaling-stroke"
      />
      <path
        d="M40,0 L40,80"
        stroke="rgba(118,75,162,0.08)"
        stroke-width="0.5"
        vector-effect="non-scaling-stroke"
      />
      <path
        d="M40,0 L80,40"
        stroke="rgba(118,75,162,0.08)"
        stroke-width="0.5"
        vector-effect="non-scaling-stroke"
      />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#triangle)"/>
</svg>
